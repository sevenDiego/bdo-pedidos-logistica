spring.application.name=bdo-pedidos-logistica


# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# Crear las tablas al arrancar y eliminarlas al cerrar
spring.jpa.hibernate.ddl-auto=create-drop

# Habilitar la consola web de H2
spring.h2.console.enabled=true


# Proveedor logistico
logistica.base-url=http://localhost:9090
logistica.token=${LOGISTICA_TOKEN:}

# Tiempos de espera HTTP
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=6s